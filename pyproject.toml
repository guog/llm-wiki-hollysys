[project]
name = "llm-wiki-document-tools"
version = "0.1.0"
description = "Python document helpers for the local LLM Wiki toolchain"
requires-python = ">=3.10,<3.14"
dependencies = [
  "openpyxl>=3.1.5,<4",
  "pymupdf>=1.26,<2",
  "python-docx>=1.2,<2",
  "python-pptx>=1.0,<2",
  "pyyaml>=6.0,<7",
]

[tool.uv]
package = false
